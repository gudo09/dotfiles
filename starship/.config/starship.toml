style = "bg:git_bg_color"

[git_commit]
tag_symbol = '  '
disabled = true

[git_status]
style = "bg:git_bg_color"
format = '[[($all_status$ahead_behind )](fg:git_text_color bg:git_bg_color)]($style)'

