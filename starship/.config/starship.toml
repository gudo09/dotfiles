"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = """
[░▒▓](os_bg_color)\
$os\
[](bg:directory_bg_color fg:os_bg_color)\
$username\
$directory\
[](fg:directory_bg_color bg:git_bg_color)\
$git_branch\
$git_status\
[](fg:git_bg_color bg:lang_bg_color)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:lang_bg_color bg:time_bg_color)\
$time\
[ ](fg:time_bg_color)\
$line_break\
$character"""

palette = "default"

[palettes.default]
os_bg_color = "#a3aed2"
os_logo_color = "#090c0c"
directory_bg_color = "#769ff0"
directory_text_color = "#e3e5e5"
git_bg_color = "#394260"
git_text_color = "#769ff0"
lang_bg_color = "#212736"
lang_text_color = "#769ff0"
time_bg_color = "#1d2230"
time_text_color = "#a0a9cb"

[aws]
symbol = " "

[azure]
symbol = " "

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

[buf]
symbol = " "

[bun]
symbol = " "
style = "bg:lang_bg_color"
format = '[[ $symbol ($version) ](fg:lang_text_color bg:lang_bg_color)]($style)'

[c]
symbol = " "

[cpp]
symbol = " "

[character]
success_symbol = "[ ](bold green)"
error_symbol = "[ ](bold red)"

[cmake]
symbol = " "

[cobol]
symbol = " "

[conda]
symbol = " "

[container]
symbol = " "

[crystal]
symbol = " "

[dart]
symbol = " "

[deno]
symbol = " "

[direnv]
symbol = " "

[directory]
read_only = " 󰌾"
format = "[ $path ]($style)"
style = "fg:directory_text_color bg:directory_bg_color"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Documentos" = "󰈙 "
"Downloads" = " "
"Descargas" = " "
"Music" = " "
"Música" = " "
"Pictures" = " "
"Imágenes" = " "
"dotfiles" = " files"
"home" = " "
"~" = " "

[docker_context]
symbol = " "
style = "bg:lang_bg_color"
format = '[[ $symbol ($version) ](fg:lang_text_color bg:lang_bg_color)]($style)'

